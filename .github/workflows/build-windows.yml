name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt pyinstaller==6.22.3

      - name: Baixar modelo Whisper medium (embutido no app)
        shell: python
        run: |
          from huggingface_hub import snapshot_download
          snapshot_download(
              "Systran/faster-whisper-medium",
              local_dir="models/medium",
              allow_patterns=["config.json", "model.bin", "tokenizer.json", "vocabulary.*"],
          )

      - name: Baixar ffmpeg (versão fixa, hash verificado)
        shell: pwsh
        env:
          FFMPEG_TAG: autobuild-2026-09-24-14-14
          FFMPEG_ZIP: ffmpeg-N-126826-gc0e8b139fd-win64-gpl.zip
          FFMPEG_SHA256: 4717796af522c1d129e77ea5d24ab1f3ce9eb72719454d4e1948eb16347b3d93
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_TAG/$env:FFMPEG_ZIP" -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "Hash do ffmpeg não confere: $hash" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg\ffmpeg.exe

      - name: Empacotar com PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name TranscritorDeAudio `
            --icon assets/icon.ico `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime `
            --add-data "assets/icon.ico;assets" `
            --add-data "ffmpeg;ffmpeg" `
            --add-data "models;models" `
            transcriber_app.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\setup.iss

      - name: Gerar SHA-256 do instalador
        shell: pwsh
        run: |
          Get-ChildItem dist-installer\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TranscritorDeAudio-Setup
          path: |
            dist-installer/*.exe
            dist-installer/*.sha256
          compression-level: 0

      - name: Publicar Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist-installer/*.exe
            dist-installer/*.sha256
