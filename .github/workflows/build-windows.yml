name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt pyinstaller

      - name: Baixar modelo Whisper medium (embutido no app)
        shell: python
        run: |
          from huggingface_hub import snapshot_download
          snapshot_download(
              "Systran/faster-whisper-medium",
              local_dir="models/medium",
              allow_patterns=["config.json", "model.bin", "tokenizer.json", "vocabulary.*"],
          )

      - name: Baixar ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg\ffmpeg.exe

      - name: Empacotar com PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name TranscritorDeAudio `
            --icon assets/icon.ico `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime `
            --add-data "assets/icon.ico;assets" `
            --add-data "ffmpeg;ffmpeg" `
            --add-data "models;models" `
            transcriber_app.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: TranscritorDeAudio-Setup
          path: dist-installer/*.exe
          compression-level: 0

      - name: Publicar Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
